<!DOCTYPE html>
<!-- SHOP: Chợ Biện Kinh — trang độc lập, build từ src/shop.template.html + src/07-shop.js
     (xem tools/build.mjs). Tự chứa, không CDN ngoài, chạy offline. -->
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0805">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23140c07'/%3E%3Ctext x='32' y='45' font-size='36' text-anchor='middle' fill='%23ffd76b'%3E%E5%B8%82%3C/text%3E%3C/svg%3E">
<title>Chợ Biện Kinh — Mộng Võ Lâm 3D</title>
<style>
/* SHOP-BEGIN */
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { font-size: 16px; }
body {
  font-family: "Palatino Linotype", Georgia, "Times New Roman", serif;
  background: linear-gradient(180deg, #1a1208 0%, #0b0805 60%, #120d06 100%);
  color: #f5e9c9; min-height: 100vh; padding-bottom: 90px;
}
.shop-head {
  position: sticky; top: 0; z-index: 20;
  background: linear-gradient(180deg, #241708, #160f05);
  border-bottom: 2px solid #8a6a2f; padding: 10px 12px 8px;
}
.shop-head h1 { font-size: 1.35rem; color: #ffd76b; letter-spacing: 1px; }
.shop-head h1 span { font-size: .8rem; color: #d8b96a; font-weight: 400; }
.shop-wallet {
  display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px;
  font-size: 1.05rem; background: #00000055; border: 1px solid #6b5223;
  border-radius: 10px; padding: 8px 10px;
}
.shop-wallet b { color: #ffd76b; }
.shop-player { margin-top: 6px; font-size: .85rem; color: #cbb37a; }
.shop-featured { margin: 10px 12px 0; border: 1px solid #b8860b; border-radius: 12px;
  background: linear-gradient(135deg, #3a2a08, #1c1305); padding: 10px; }
.shop-feat-head { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: .9rem; }
.shop-feat-head span { color: #cbb37a; font-size: .8rem; }
.shop-feat-list { display: flex; gap: 8px; overflow-x: auto; margin-top: 8px; padding-bottom: 4px; }
.shop-feat-item {
  flex: 0 0 auto; font: inherit; font-size: .85rem; color: #ffe9ad; cursor: pointer;
  background: #2b1d08; border: 1px solid #8a6a2f; border-radius: 10px; padding: 8px 10px;
}
.shop-feat-item b { color: #ffd76b; }
.shop-tabs {
  display: flex; gap: 8px; overflow-x: auto; padding: 12px 12px 4px;
  scrollbar-width: none; position: sticky; top: 0; z-index: 10;
}
.shop-tabs::-webkit-scrollbar { display: none; }
.shop-tab {
  flex: 0 0 auto; font: inherit; font-size: .95rem; cursor: pointer; color: #f5e9c9;
  background: #241a0c; border: 1px solid #6b5223; border-radius: 99px; padding: 10px 14px;
  min-height: 44px;
}
.shop-tab.on { background: linear-gradient(180deg, #f59e0b, #b45309); color: #fff7e0; border-color: #fde68a; font-weight: 700; }
.shop-count { background: #00000066; border-radius: 99px; padding: 1px 7px; font-size: .8rem; }
.shop-controls { display: flex; gap: 8px; padding: 8px 12px; }
.shop-controls input, .shop-controls select {
  font: inherit; font-size: 1rem; color: #f5e9c9; background: #1c1305;
  border: 1px solid #6b5223; border-radius: 10px; padding: 10px 12px; min-height: 44px;
}
.shop-controls input { flex: 1; min-width: 0; }
.shop-controls select { flex: 0 0 auto; max-width: 42%; }
#shop-count { padding: 0 14px 6px; color: #cbb37a; font-size: .85rem; }
.shop-note { color: #cbb37a; font-size: .9rem; margin: 4px 2px 10px; line-height: 1.5; }
.shop-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 10px; padding: 0 12px;
}
@media (min-width: 700px) { .shop-grid { grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); } }
.shop-card {
  background: linear-gradient(180deg, #2b1f0e, #1a130a); border: 1px solid #6b5223;
  border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 6px;
}
.shop-card.featured { border-color: #f59e0b; box-shadow: 0 0 0 1px #f59e0b66, 0 4px 18px #f59e0b33; }
.shop-card-top { display: flex; align-items: center; gap: 6px; }
.shop-ic { font-size: 1.7rem; }
.shop-rarity { font-size: .75rem; font-weight: 700; border-radius: 99px; padding: 2px 8px; }
.r-common { background: #334155; color: #e2e8f0; }
.r-rare { background: #1d4ed8; color: #dbeafe; }
.r-epic { background: #7e22ce; color: #f3e8ff; }
.r-legend { background: #b45309; color: #fef3c7; }
.shop-flash { font-size: .7rem; font-weight: 700; color: #fde68a; background: #92400e; border-radius: 99px; padding: 2px 7px; }
.shop-name { font-size: 1.02rem; color: #ffe9ad; line-height: 1.3; }
.shop-stat { font-size: .88rem; color: #7dd3fc; }
.shop-desc { font-size: .85rem; color: #cbb37a; line-height: 1.45; flex: 1; }
.shop-buyrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 4px; }
.shop-price { color: #ffd76b; font-weight: 700; font-size: .95rem; }
.shop-btn {
  font: inherit; font-weight: 700; cursor: pointer; color: #1a1208; min-height: 44px;
  background: linear-gradient(180deg, #fde68a, #f59e0b); border: 1px solid #fde68a;
  border-radius: 10px; padding: 8px 16px; font-size: 1rem;
}
.shop-btn:disabled { opacity: .45; cursor: not-allowed; }
.shop-btn.big { width: 100%; }
.shop-btn.sell { background: linear-gradient(180deg, #bae6fd, #38bdf8); border-color: #bae6fd; font-size: .9rem; line-height: 1.2; }
.shop-bundle-items { display: flex; flex-direction: column; gap: 3px; font-size: .88rem; color: #e7d6a4; }
.shop-bag-row {
  display: flex; align-items: center; gap: 10px; grid-column: 1 / -1;
  background: #241a0c; border: 1px solid #6b5223; border-radius: 12px; padding: 10px 12px;
}
.shop-bag-info { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.shop-bag-info b { color: #ffe9ad; }
.shop-bag-info span { font-size: .85rem; color: #cbb37a; }
.shop-empty { grid-column: 1 / -1; color: #cbb37a; padding: 20px 4px; text-align: center; }
.shop-foot {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  display: flex; gap: 10px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
  background: linear-gradient(0deg, #160f05, #160f05ee); border-top: 2px solid #8a6a2f;
}
.shop-foot .shop-btn { flex: 1; font-size: 1.1rem; }
.shop-foot-note { align-self: center; font-size: .8rem; color: #cbb37a; text-align: right; max-width: 46%; }
#shop-toast { position: fixed; left: 12px; right: 12px; bottom: 86px; z-index: 30; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
.shop-toast-item {
  background: #14532d; color: #dcfce7; border: 1px solid #4ade80; border-radius: 10px;
  padding: 10px 14px; font-size: .95rem; max-width: 560px; text-align: center;
  box-shadow: 0 4px 16px #00000088;
}
.shop-toast-item.bad { background: #7f1d1d; color: #fee2e2; border-color: #f87171; }
/* SHOP-END */
</style>
</head>
<body>
<div class="shop-head">
  <h1>🏮 Chợ Biện Kinh <span>· Mộng Võ Lâm 3D</span></h1>
  <div class="shop-wallet" id="shop-wallet"><span>🪙 <b>…</b> KNB</span><span>⚪ <b>…</b> bạc</span></div>
  <div class="shop-player" id="shop-player"></div>
</div>

<div class="shop-featured" id="shop-featured"></div>
<div class="shop-tabs" id="shop-tabs"></div>
<div class="shop-controls">
  <input id="shop-search" type="search" placeholder="🔍 Tìm món: kiếm, đan, ngọc…" autocomplete="off">
  <select id="shop-rarity" aria-label="Lọc độ hiếm">
    <option value="all">Mọi độ hiếm</option>
    <option value="Thường">Thường</option>
    <option value="Hiếm">Hiếm</option>
    <option value="Sử Thi">Sử Thi</option>
    <option value="Truyền Thuyết">Truyền Thuyết</option>
  </select>
</div>
<div id="shop-count"></div>
<div class="shop-grid" id="shop-grid"></div>

<div class="shop-foot">
  <button class="shop-btn" data-act="back">🏯 Về Thành</button>
  <div class="shop-foot-note">Mua xong lưu ngay vào save game — về thành là thấy đồ.</div>
</div>
<div id="shop-toast"></div>

<script>
__SHOP__
</script>
</body>
</html>

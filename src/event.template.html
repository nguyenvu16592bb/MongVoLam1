<!DOCTYPE html>
<!-- EVENT: Sự Kiện — trang độc lập, build từ src/event.template.html + src/09-event.js
     (xem tools/build.mjs). Tự chứa, không CDN ngoài, chạy offline.
     Mọi mốc giờ trên trang này tính theo GIỜ ĐỊA PHƯƠNG của máy (khác với chợ dùng giờ UTC). -->
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0805">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23140c07'/%3E%3Ctext x='32' y='45' font-size='36' text-anchor='middle' fill='%23ffd76b'%3E%E7%A6%8F%3C/text%3E%3C/svg%3E">
<title>Sự Kiện — Mộng Võ Lâm 3D</title>
<style>
/* EVENT-BEGIN */
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { font-size: 16px; }
body {
  font-family: "Palatino Linotype", Georgia, "Times New Roman", serif;
  background: linear-gradient(180deg, #1a1208 0%, #0b0805 60%, #120d06 100%);
  color: #f5e9c9; min-height: 100vh; padding-bottom: 90px;
}
.ev-head {
  position: sticky; top: 0; z-index: 20;
  background: linear-gradient(180deg, #241708, #160f05);
  border-bottom: 2px solid #8a6a2f; padding: 10px 12px 8px;
}
.ev-head h1 { font-size: 1.35rem; color: #ffd76b; letter-spacing: 1px; }
.ev-head h1 span { font-size: .8rem; color: #d8b96a; font-weight: 400; }
.ev-clock {
  margin-top: 6px; font-size: 1rem; color: #ffe9ad;
  background: #00000055; border: 1px solid #6b5223;
  border-radius: 10px; padding: 8px 10px;
}
.ev-clock small { display: block; font-size: .8rem; color: #cbb37a; margin-top: 2px; }
.ev-wallet {
  display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px;
  font-size: 1.05rem; background: #00000055; border: 1px solid #6b5223;
  border-radius: 10px; padding: 8px 10px;
}
.ev-wallet b { color: #ffd76b; }
.ev-player { margin-top: 6px; font-size: .85rem; color: #cbb37a; }
.ev-tabs {
  display: flex; gap: 8px; overflow-x: auto; padding: 12px 12px 4px;
  scrollbar-width: none; position: sticky; top: 0; z-index: 10;
}
.ev-tabs::-webkit-scrollbar { display: none; }
.ev-tab {
  flex: 0 0 auto; font: inherit; font-size: .95rem; cursor: pointer; color: #f5e9c9;
  background: #241a0c; border: 1px solid #6b5223; border-radius: 99px; padding: 10px 14px;
  min-height: 44px; white-space: nowrap;
}
.ev-tab.on { background: linear-gradient(180deg, #f59e0b, #b45309); color: #fff7e0; border-color: #fde68a; font-weight: 700; }
.ev-note { color: #cbb37a; font-size: .9rem; margin: 10px 14px; line-height: 1.55; }
.ev-note b { color: #ffe9ad; }
.ev-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 10px; padding: 0 12px;
}
@media (min-width: 700px) { .ev-grid { grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); } }
.ev-card {
  background: linear-gradient(180deg, #2b1f0e, #1a130a); border: 1px solid #6b5223;
  border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 6px;
}
.ev-card.wide { grid-column: 1 / -1; }
.ev-card.today { border-color: #f59e0b; box-shadow: 0 0 0 1px #f59e0b66, 0 4px 18px #f59e0b33; }
.ev-card.done { opacity: .75; }
.ev-card.locked { opacity: .6; }
.ev-card-top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.ev-ic { font-size: 1.7rem; }
.ev-badge { font-size: .75rem; font-weight: 700; border-radius: 99px; padding: 2px 8px; }
.ev-badge.live { background: #14532d; color: #dcfce7; }
.ev-badge.upcoming { background: #1d4ed8; color: #dbeafe; }
.ev-badge.ended { background: #7f1d1d; color: #fee2e2; }
.ev-name { font-size: 1.02rem; color: #ffe9ad; line-height: 1.3; }
.ev-desc { font-size: .85rem; color: #cbb37a; line-height: 1.45; flex: 1; }
.ev-mark { font-size: .85rem; color: #ffd76b; }
.ev-cd { font-size: .9rem; color: #7dd3fc; font-weight: 700; }
.ev-reward { font-size: .88rem; color: #ffd76b; }
.ev-prog { font-size: .85rem; color: #cbb37a; }
.ev-manual { font-size: .82rem; color: #fca5a5; line-height: 1.45; margin-top: 4px; }
.ev-bar { height: 6px; background: #1b140d; border-radius: 99px; overflow: hidden; margin-top: 4px; }
.ev-bar i { display: block; height: 100%; background: linear-gradient(90deg, #f59e0b, #fde68a); }
.ev-row {
  display: flex; align-items: center; gap: 10px; grid-column: 1 / -1;
  background: linear-gradient(180deg, #2b1f0e, #1a130a); border: 1px solid #6b5223;
  border-radius: 14px; padding: 12px;
}
.ev-row.me { border-color: #f59e0b; }
.ev-row-info { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.ev-row-info b { color: #ffe9ad; }
.ev-row-info span { font-size: .85rem; color: #cbb37a; line-height: 1.45; }
.ev-row-info .ev-reward { color: #ffd76b; }
.ev-rank { font-size: 1.3rem; font-weight: 700; color: #ffd76b; min-width: 34px; text-align: center; }
.ev-cta { margin: 12px; }
.ev-btn {
  font: inherit; font-weight: 700; cursor: pointer; color: #1a1208; min-height: 44px;
  background: linear-gradient(180deg, #fde68a, #f59e0b); border: 1px solid #fde68a;
  border-radius: 10px; padding: 8px 16px; font-size: 1rem; flex: 0 0 auto;
}
.ev-btn:disabled { opacity: .45; cursor: not-allowed; }
.ev-btn.big { width: 100%; font-size: 1.05rem; }
.ev-btn span { font-size: .85rem; font-weight: 400; }
.ev-empty { grid-column: 1 / -1; color: #cbb37a; padding: 20px 4px; text-align: center; }
.ev-foot {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  display: flex; gap: 10px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
  background: linear-gradient(0deg, #160f05, #160f05ee); border-top: 2px solid #8a6a2f;
}
.ev-foot .ev-btn { flex: 1; font-size: 1.1rem; }
.ev-foot-note { align-self: center; font-size: .8rem; color: #cbb37a; text-align: right; max-width: 46%; }
#toast { position: fixed; left: 12px; right: 12px; bottom: 86px; z-index: 30; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
.ev-toast-item {
  background: #14532d; color: #dcfce7; border: 1px solid #4ade80; border-radius: 10px;
  padding: 10px 14px; font-size: .95rem; max-width: 560px; text-align: center;
  box-shadow: 0 4px 16px #00000088;
}
.ev-toast-item.bad { background: #7f1d1d; color: #fee2e2; border-color: #f87171; }
/* EVENT-END */
</style>
</head>
<body>
<div class="ev-head">
  <h1>📅 Sự Kiện <span>· Mộng Võ Lâm 3D</span></h1>
  <div class="ev-clock" id="event-clock">🕒 Giờ địa phương: …<small>Mọi mốc giờ trên trang này tính theo giờ địa phương của máy — khác với chợ (giờ UTC).</small></div>
  <div class="ev-wallet" id="event-wallet"><span>🪙 <b>…</b> KNB</span><span>⚪ <b>…</b> bạc</span></div>
  <div class="ev-player" id="event-player"></div>
</div>

<div class="ev-tabs" id="event-tabs"></div>
<div id="event-grid"></div>

<div class="ev-foot">
  <button class="ev-btn" data-act="back">🏯 Về Thành</button>
  <div class="ev-foot-note">Nhận thưởng lưu ngay vào save game — về thành là thấy tiền, đồ.</div>
</div>
<div id="toast"></div>

<script>
__EVENT__
</script>
</body>
</html>

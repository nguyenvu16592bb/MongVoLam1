<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mộng Võ Lâm - Võ Lâm Giang Hồ 3D</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js r128 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Font Awesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Roboto+Condensed:wght@700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --gold-light: #ffe885;
            --gold-main: #d4af37;
            --gold-dark: #7a5210;
            --crimson: #b91c1c;
            --jade: #15803d;
            --parchment: #f3e5c8;
            --parchment-dark: #d8c094;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #090a0f;
            overflow: hidden;
            font-family: 'Roboto Condensed', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Khung tỉ lệ chuẩn 16:9 co giãn tự động */
        #game-viewport {
            position: relative;
            width: 100vw;
            height: 56.25vw; /* 16:9 */
            max-height: 100vh;
            max-width: 177.78vh; /* 16:9 */
            background: #111812;
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.95), 0 0 0 2px #4a3515;
            overflow: hidden;
        }

        #three-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 1;
        }

        /* Lớp phủ giao diện 2D & Nhãn nhân vật */
        #world-labels-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 5;
            overflow: hidden;
        }

        #hud-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 10;
        }

        .pointer-auto {
            pointer-events: auto;
        }

        /* Kiểu chữ Kiếm Hiệp & Thư Pháp */
        .wuxia-title {
            font-family: 'Playfair Display', serif;
            text-shadow: 0 2px 4px #000, 0 0 10px rgba(255, 200, 0, 0.6);
        }

        .wuxia-stroke {
            text-shadow: 
                -1.5px -1.5px 0 #000,  
                 1.5px -1.5px 0 #000,
                -1.5px  1.5px 0 #000,
                 1.5px  1.5px 0 #000,
                 0px    3px   5px rgba(0,0,0,0.9);
        }

        .skill-calligraphy {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-weight: 900;
            background: linear-gradient(180deg, #ff77ff 0%, #c026d3 50%, #581c87 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 2px #fff) drop-shadow(0 3px 6px #000);
            animation: skillCalligraphyAnim 1.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes skillCalligraphyAnim {
            0% { transform: translate(-50%, -50%) scale(2.2); opacity: 0; }
            20% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            80% { transform: translate(-50%, -60%) scale(1.05); opacity: 1; }
            100% { transform: translate(-50%, -80%) scale(1.1); opacity: 0; }
        }

        /* Số sát thương bay lên giống ảnh 2 */
        .floating-dmg {
            position: absolute;
            font-family: 'Playfair Display', serif;
            font-weight: 900;
            pointer-events: none;
            white-space: nowrap;
            transform: translate(-50%, -50%);
            animation: dmgFloatUp 1.15s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            z-index: 20;
        }

        @keyframes dmgFloatUp {
            0% { transform: translate(-50%, -20%) scale(0.5); opacity: 0; }
            15% { transform: translate(-50%, -50%) scale(1.25); opacity: 1; }
            30% { transform: translate(-50%, -65%) scale(1.0); opacity: 1; }
            100% { transform: translate(-50%, -145%) scale(0.95); opacity: 0; }
        }

        /* Khung viền Vàng Cổ Trang */
        .wuxia-panel {
            background: linear-gradient(180deg, rgba(34, 24, 16, 0.92) 0%, rgba(18, 12, 8, 0.96) 100%);
            border: 2px solid #b8860b;
            box-shadow: inset 0 0 12px rgba(212, 175, 55, 0.3), 0 4px 12px rgba(0,0,0,0.8);
            border-radius: 8px;
        }

        .parchment-panel {
            background: radial-gradient(circle at center, #f7ebd2 0%, #e4cfa3 75%, #c9ab73 100%);
            border: 3px solid #7c4d12;
            box-shadow: inset 0 0 25px rgba(101, 61, 14, 0.45), 0 10px 30px rgba(0,0,0,0.9);
            color: #3b230a;
        }

        /* Nút Kỹ Năng Góc Phải Trên (Giống Ảnh 2) */
        .skill-btn {
            position: relative;
            width: 64px;
            height: 64px;
            border-radius: 10px;
            border: 2.5px solid #ffd700;
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.5), inset 0 0 10px rgba(0,0,0,0.8);
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.12s ease, box-shadow 0.12s ease;
        }
        .skill-btn:hover {
            transform: scale(1.07);
            box-shadow: 0 0 18px rgba(255, 230, 100, 0.9);
        }
        .skill-btn:active {
            transform: scale(0.94);
        }

        /* Nút X1 / Auto Xoáy Tím Đen (Giống Ảnh 2) */
        .orb-auto-btn {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #701a75 0%, #2e0632 65%, #09010a 100%);
            border: 3px solid #d946ef;
            box-shadow: 0 0 18px rgba(217, 70, 239, 0.7), inset 0 0 15px #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .orb-auto-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 0 25px rgba(232, 121, 249, 1);
        }

        /* Thanh Khí Thế Dưới Đáy (Giống Ảnh 2) */
        .qi-bar-container {
            width: 240px;
            height: 22px;
            background: #1c130d;
            border: 2px solid #d4af37;
            border-radius: 6px;
            padding: 2px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.9);
            position: relative;
        }
        .qi-bar-fill-green {
            height: 100%;
            background: linear-gradient(90deg, #15803d 0%, #4ade80 50%, #bbf7d0 100%);
            border-radius: 3px;
            transition: width 0.25s ease;
        }
        .qi-bar-fill-red {
            height: 100%;
            background: linear-gradient(90deg, #7f1d1d 0%, #ef4444 50%, #fca5a5 100%);
            border-radius: 3px;
            transition: width 0.25s ease;
        }

        /* Nút Menu Tròn Cổ Trang Dưới Đáy (Giống Ảnh 1 & 4) */
        .bottom-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.15s ease;
        }
        .bottom-nav-item:hover {
            transform: translateY(-5px) scale(1.06);
        }
        .bottom-nav-icon {
            width: 54px;
            height: 54px;
            border-radius: 14px;
            background: radial-gradient(circle at top, #fff3b0, #d97706 70%, #78350f);
            border: 2.5px solid #fef08a;
            box-shadow: 0 4px 10px rgba(0,0,0,0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        /* Thanh cuộn tùy chỉnh */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #b45309; border-radius: 4px; }

        /* Nhãn Áp Chế Đỏ Dọc (Giống Ảnh 2) */
        .ap-che-badge {
            background: linear-gradient(180deg, #dc2626 0%, #7f1d1d 100%);
            border: 1.5px solid #fca5a5;
            box-shadow: 0 0 10px rgba(220, 38, 38, 0.8);
            writing-mode: horizontal-tb;
            line-height: 1.05;
        }
    </style>
</head>
<body>

<div id="game-viewport">
    <!-- Canvas 3D Three.js -->
    <canvas id="three-canvas"></canvas>

    <!-- Lớp Nhãn Nhân Vật & Thanh Máu Trong Thế Giới 3D -->
    <div id="world-labels-layer"></div>

    <!-- Lớp Giao Diện MMORPG -->
    <div id="hud-layer">
        
        <!-- GÓC TRÊN BÊN TRÁI: Thông Tin & Chỉ Số (Giống Ảnh 1 & 2) -->
        <div class="absolute top-2 left-3 flex flex-col gap-1.5 pointer-auto">
            <!-- Khung Nhân Vật Chính & Tài Nguyên -->
            <div class="flex items-start gap-2">
                <!-- Cờ Cấp Độ & Chân Dung (Giống Ảnh 1 & 4) -->
                <div onclick="GameUI.openModal('character')" class="relative cursor-pointer group">
                    <div class="w-14 h-16 bg-gradient-to-b from-red-600 via-red-800 to-amber-950 border-2 border-yellow-400 rounded-b-2xl flex flex-col items-center justify-center shadow-lg group-hover:scale-105 transition">
                        <span class="text-[10px] text-yellow-200 uppercase font-bold tracking-wider">Cấp</span>
                        <span id="hud-player-lvl" class="text-2xl font-black text-yellow-300 wuxia-stroke leading-none">100</span>
                    </div>
                    <div class="absolute -bottom-1 -right-2 bg-amber-900 border border-yellow-400 text-yellow-300 text-[10px] font-bold px-1.5 rounded">
                        VIP14
                    </div>
                </div>

                <!-- Bảng Chỉ Số Chiến Đấu Trực Tiếp (Giống Ảnh 2) -->
                <div class="flex flex-col gap-0.5 bg-black/45 backdrop-blur-[2px] px-2.5 py-1.5 rounded-lg border border-yellow-600/40">
                    <div class="flex items-center gap-3">
                        <span id="hud-top-name" class="text-emerald-300 font-bold text-sm wuxia-stroke tracking-wide">Ma Giáo Cao Thủ</span>
                        <span class="text-xs text-amber-300 font-bold wuxia-stroke"><i class="fas fa-khanda text-sky-300 mr-1"></i><span id="stat-atk">1620953</span></span>
                        <span class="text-xs text-cyan-300 font-bold wuxia-stroke"><i class="fas fa-feather-alt mr-1"></i><span id="stat-spd">0.10</span></span>
                    </div>
                    
                    <!-- Thanh HP Đỏ & Chỉ Số -->
                    <div class="flex items-center gap-2">
                        <div class="relative w-36 h-4 bg-gray-900 border border-yellow-500/80 rounded overflow-hidden">
                            <div id="hud-hp-bar" class="h-full bg-gradient-to-r from-red-700 via-red-500 to-orange-400 transition-all duration-200" style="width: 85%;"></div>
                            <span id="hud-hp-text" class="absolute inset-0 text-[11px] font-bold text-white flex items-center justify-center wuxia-stroke">5819928/30677004</span>
                        </div>
                        <span class="text-xs text-gray-200 font-bold wuxia-stroke"><i class="fas fa-shield-alt text-amber-400 mr-1"></i><span id="stat-def">1620822</span></span>
                        <span class="text-xs text-amber-200 font-bold wuxia-stroke"><i class="fas fa-shoe-prints text-orange-400 mr-1"></i><span id="stat-dodge">3.74</span></span>
                    </div>

                    <!-- Thanh Nội Lực MP Xanh & Chỉ Số -->
                    <div class="flex items-center gap-2">
                        <div class="relative w-36 h-4 bg-gray-900 border border-sky-400/80 rounded overflow-hidden">
                            <div id="hud-mp-bar" class="h-full bg-gradient-to-r from-blue-800 via-blue-500 to-cyan-300 transition-all duration-200" style="width: 68%;"></div>
                            <span id="hud-mp-text" class="absolute inset-0 text-[11px] font-bold text-white flex items-center justify-center wuxia-stroke">269151/12966576</span>
                        </div>
                        <span class="text-xs text-red-300 font-bold wuxia-stroke"><i class="fas fa-heart text-red-500 mr-1"></i><span id="stat-crit">170000</span></span>
                        <span class="text-xs text-purple-200 font-bold wuxia-stroke"><i class="fas fa-yin-yang text-white mr-1"></i><span id="stat-qi">162082</span></span>
                    </div>
                </div>
            </div>

            <!-- Hàng Nút Thoát Trận, Sao Đánh Giá & Tiền Tệ (Giống Ảnh 1 & 2) -->
            <div class="flex items-center gap-2 mt-0.5">
                <button onclick="GameEngine.togglePause()" title="Tạm dừng / Cài đặt" class="w-8 h-8 rounded-full bg-stone-800/90 border border-amber-500 text-red-500 hover:bg-red-950 flex items-center justify-center shadow">
                    <i class="fas fa-times text-base"></i>
                </button>
                <div class="flex items-center text-yellow-400 text-sm drop-shadow">
                    <i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star text-gray-500"></i>
                </div>
                <!-- KNB & Bạc -->
                <div class="flex items-center gap-2 bg-black/60 border border-yellow-600/50 rounded-full px-2.5 py-0.5 text-xs">
                    <span class="text-yellow-300 font-bold"><i class="fas fa-coins text-yellow-400 mr-1"></i><span id="res-gold">14995138</span></span>
                    <span class="text-slate-200 font-bold"><i class="fas fa-gem text-cyan-300 mr-1"></i><span id="res-silver">11158534816</span></span>
                </div>
            </div>
        </div>

        <!-- GÓC TRÊN GIỮA: Chọn Chiến Trường (3 Map từ Ảnh 1, 2, 3) -->
        <div class="absolute top-2 left-1/2 -translate-x-1/2 flex items-center gap-1.5 bg-black/65 border border-amber-500/60 px-2 py-1 rounded-full pointer-auto shadow-lg">
            <button onclick="GameEngine.switchMap('bamboo')" id="btn-map-bamboo" class="px-3 py-1 rounded-full text-xs font-bold bg-emerald-700 text-yellow-200 border border-yellow-400 transition">
                <i class="fas fa-tree mr-1"></i>Rừng Trúc U Minh
            </button>
            <button onclick="GameEngine.switchMap('buddha')" id="btn-map-buddha" class="px-3 py-1 rounded-full text-xs font-bold bg-stone-800 text-gray-300 hover:text-white transition">
                <i class="fas fa-torii-gate mr-1"></i>Đài Phật Anh Đào
            </button>
            <button onclick="GameEngine.switchMap('city')" id="btn-map-city" class="px-3 py-1 rounded-full text-xs font-bold bg-stone-800 text-gray-300 hover:text-white transition">
                <i class="fas fa-city mr-1"></i>Biện Kinh Thành
            </button>
        </div>

        <!-- GÓC TRÊN BÊN PHẢI: 4 Ô Tuyệt Kỹ Lớn (Giống Ảnh 2) -->
        <div class="absolute top-3 right-4 flex flex-col items-end gap-2 pointer-auto">
            <div class="flex items-center gap-2.5">
                <!-- Skill 1: Hỏa Long Phần Thiên -->
                <div onclick="CombatSystem.triggerManualSkill(0)" class="skill-btn group" title="[Phím 1] Hỏa Long Phần Thiên - Sát thương diện rộng cực lớn">
                    <div class="w-full h-full bg-gradient-to-br from-orange-500 via-red-600 to-amber-900 flex items-center justify-center">
                        <i class="fas fa-dragon text-3xl text-yellow-200 drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)]"></i>
                    </div>
                    <div id="cd-overlay-0" class="absolute inset-0 bg-black/75 flex items-center justify-center text-white font-black text-lg hidden">0</div>
                    <span class="absolute bottom-0.5 right-1 text-[10px] font-bold text-yellow-300 wuxia-stroke">Lv.10</span>
                    <span class="absolute top-0.5 left-1 text-[10px] font-bold text-white/80 wuxia-stroke">1</span>
                </div>

                <!-- Skill 2: Tử Lôi Kiếm Khí -->
                <div onclick="CombatSystem.triggerManualSkill(1)" class="skill-btn group" title="[Phím 2] Tử Lôi Kiếm Khí - Đao Chữ Thần Thông">
                    <div class="w-full h-full bg-gradient-to-br from-fuchsia-500 via-purple-700 to-indigo-950 flex items-center justify-center">
                        <i class="fas fa-bolt text-3xl text-pink-200 drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)]"></i>
                    </div>
                    <div id="cd-overlay-1" class="absolute inset-0 bg-black/75 flex items-center justify-center text-white font-black text-lg hidden">0</div>
                    <span class="absolute bottom-0.5 right-1 text-[10px] font-bold text-yellow-300 wuxia-stroke">Lv.10</span>
                    <span class="absolute top-0.5 left-1 text-[10px] font-bold text-white/80 wuxia-stroke">2</span>
                </div>

                <!-- Skill 3: Hắc Ám Ma Công -->
                <div onclick="CombatSystem.triggerManualSkill(2)" class="skill-btn group" title="[Phím 3] Hắc Ám Ma Công - Tăng Bạo Kích & Hút Sinh Lực">
                    <div class="w-full h-full bg-gradient-to-br from-indigo-600 via-violet-900 to-black flex items-center justify-center">
                        <i class="fas fa-user-ninja text-3xl text-purple-300 drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)]"></i>
                    </div>
                    <div id="cd-overlay-2" class="absolute inset-0 bg-black/75 flex items-center justify-center text-white font-black text-lg hidden">0</div>
                    <span class="absolute bottom-0.5 right-1 text-[10px] font-bold text-yellow-300 wuxia-stroke">Lv.9</span>
                    <span class="absolute top-0.5 left-1 text-[10px] font-bold text-white/80 wuxia-stroke">3</span>
                </div>

                <!-- Skill 4: Mạn Thiên Hoa Vũ / Cửu Thiên Huyền Qua -->
                <div onclick="CombatSystem.triggerManualSkill(3)" class="skill-btn group" title="[Phím 4] Mạn Thiên Hoa Vũ - Triệu hồi bão kiếm băng giá">
                    <div class="w-full h-full bg-gradient-to-br from-cyan-400 via-blue-600 to-indigo-900 flex items-center justify-center">
                        <i class="fas fa-dharmachakra fa-spin text-3xl text-cyan-100 drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)]" style="animation-duration: 8s;"></i>
                    </div>
                    <div id="cd-overlay-3" class="absolute inset-0 bg-black/75 flex items-center justify-center text-white font-black text-lg hidden">0</div>
                    <span class="absolute bottom-0.5 right-1 text-[10px] font-bold text-yellow-300 wuxia-stroke">Lv.10</span>
                    <span class="absolute top-0.5 left-1 text-[10px] font-bold text-white/80 wuxia-stroke">4</span>
                </div>
            </div>

            <!-- Thanh công cụ nhanh bên phải (Giống Ảnh 1) -->
            <div class="flex flex-col gap-2 mt-1">
                <button onclick="GameUI.openModal('character')" title="Nhân Vật & Duyên Phận" class="w-10 h-10 rounded-full bg-amber-900/90 border-2 border-yellow-400 text-yellow-300 flex items-center justify-center shadow-lg hover:scale-110 transition">
                    <i class="fas fa-user-shield"></i>
                </button>
                <button onclick="GameUI.openModal('editor')" title="Trình Chỉnh Sửa Engine & Spine" class="w-10 h-10 rounded-full bg-sky-900/90 border-2 border-cyan-400 text-cyan-200 flex items-center justify-center shadow-lg hover:scale-110 transition">
                    <i class="fas fa-cogs"></i>
                </button>
                <button onclick="GameUI.openModal('mail')" title="Thư Tín Giang Hồ" class="w-10 h-10 rounded-full bg-amber-800/90 border-2 border-amber-300 text-amber-200 flex items-center justify-center shadow-lg hover:scale-110 transition relative">
                    <i class="fas fa-envelope"></i>
                    <span class="absolute -top-1 -right-1 w-4 h-4 bg-red-600 text-white text-[10px] font-bold rounded-full flex items-center justify-center">3</span>
                </button>
            </div>
        </div>

        <!-- CẠNH TRÁI GIỮA: Radar / Auto Quest (Giống Ảnh 1) -->
        <div class="absolute top-1/3 left-3 flex flex-col gap-2 pointer-auto">
            <div onclick="GameEngine.toggleAutoBattle()" class="relative w-12 h-12 rounded-full bg-emerald-900/80 border-2 border-emerald-400 flex items-center justify-center cursor-pointer shadow-lg hover:scale-105 transition" title="Bật/Tắt Tự Động Chiến Đấu">
                <i id="auto-radar-icon" class="fas fa-crosshairs text-emerald-300 text-xl fa-spin" style="animation-duration: 4s;"></i>
                <span id="auto-status-badge" class="absolute -top-1 -right-1 px-1.5 bg-red-600 text-white text-[10px] font-bold rounded-full border border-white">AUTO</span>
            </div>
            <div class="text-[11px] text-white/80 font-mono wuxia-stroke px-1" id="fps-counter">60 fps</div>
        </div>

        <!-- GÓC DƯỚI PHẢI TRÊN THANH KHÍ THẾ: Nút Tốc Độ Trận Đấu X1/X2/X3/X5 (Giống Ảnh 2) -->
        <div class="absolute bottom-24 right-14 flex items-center gap-3 pointer-auto">
            <button onclick="GameEngine.toggleAutoSkill()" id="btn-auto-skill" class="px-3 py-1.5 rounded-full bg-purple-950/90 border border-fuchsia-400 text-fuchsia-200 text-xs font-bold shadow-lg hover:bg-purple-900 transition">
                <i class="fas fa-magic mr-1 text-yellow-300"></i>Tự Tung Chiêu: BẬT
            </button>
            <div onclick="GameEngine.cycleBattleSpeed()" class="orb-auto-btn" title="Thay đổi tốc độ trận đấu (X1, X2, X3, X5)">
                <span id="battle-speed-text" class="text-2xl font-black text-amber-300 wuxia-stroke leading-none">X1</span>
                <span class="text-[9px] text-fuchsia-200 font-bold uppercase tracking-wider">Tốc Độ</span>
            </div>
        </div>

        <!-- PHÍA DƯỚI MÀN HÌNH: 2 Bảng Trạng Thái Khí Thế & Thanh Menu Môn Phái (Giống Ảnh 1 & 2) -->
        <div class="absolute bottom-2 inset-x-4 flex items-end justify-between pointer-auto">
            
            <!-- BÊN TRÁI: Tùy Tiêu Sầu & Khí Thế (Giống Ảnh 2) -->
            <div class="flex items-center gap-2">
                <div class="flex flex-col items-center">
                    <div class="flex items-end gap-3 mb-0.5">
                        <span class="text-amber-300 font-black text-lg tracking-wider wuxia-title">KHÍ THẾ</span>

// 4. HỆ THỐNG DỰNG CẢNH 3D ISOMETRIC (3 Map từ Ảnh 1, 2, 3)
window.MapSystem = {
    group: null,

    clearMap: function(scene) {
        if (this.group) {
            scene.remove(this.group);
        }
        this.group = new THREE.Group();
        scene.add(this.group);
    },

    // MAP 1 (Ảnh 2): Đấu Trường Rừng Trúc U Minh
    buildBambooForestMap: function(scene) {
        this.clearMap(scene);
        scene.background = new THREE.Color(0x162918);
        scene.fog = new THREE.FogExp2(0x1a301c, 0.016);

        // Mặt đất rêu phong & đường mòn đá cổ
        const groundGeo = new THREE.PlaneGeometry(70, 70, 32, 32);
        const groundMat = new THREE.MeshStandardMaterial({ 
            color: 0x354a29, 
            roughness: 0.9,
            metalness: 0.05
        });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        this.group.add(ground);

        // Đá lát cổ ở trung tâm đấu trường
        const stoneMat = new THREE.MeshStandardMaterial({ color: 0x5c6356, roughness: 0.85 });
        for (let i = 0; i < 18; i++) {
            const slab = new THREE.Mesh(new THREE.BoxGeometry(2.4 + Math.random()*1.5, 0.12, 1.8 + Math.random()), stoneMat);
            const angle = (i / 18) * Math.PI * 2;
            const r = 2 + (i % 3) * 3.5;
            slab.position.set(Math.cos(angle) * r, 0.06, Math.sin(angle) * r);
            slab.rotation.y = Math.random() * Math.PI;
            slab.receiveShadow = true;
            this.group.add(slab);
        }

        // Bức tường đá cổ kính phía bắc (Giống nền trên Ảnh 2)
        const wallGroup = new THREE.Group();
        const wallBase = new THREE.Mesh(new THREE.BoxGeometry(10, 1.8, 1.2), stoneMat);
        wallBase.position.set(0, 0.9, -15);
        wallBase.castShadow = true;
        wallGroup.add(wallBase);
        for (let x = -4; x <= 4; x += 4) {
            const pillar = new THREE.Mesh(new THREE.BoxGeometry(1.1, 2.7, 1.5), stoneMat);
            pillar.position.set(x, 1.35, -15);
            pillar.castShadow = true;
            wallGroup.add(pillar);
        }
        this.group.add(wallGroup);

        // Rừng Trúc Xanh Rậm Rạp bao quanh (Giống Ảnh 2)
        const bambooStemMat = new THREE.MeshStandardMaterial({ color: 0x4d7c2b, roughness: 0.45 });
        const bambooLeafMat = new THREE.MeshStandardMaterial({ color: 0x2f5e1e, side: THREE.DoubleSide });

        const createBambooStalk = (x, z, height) => {
            const stalk = new THREE.Group();
            const segCount = Math.floor(height / 1.4);
            for (let s = 0; s < segCount; s++) {
                const seg = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.16, 1.32, 8), bambooStemMat);
                seg.position.y = s * 1.4 + 0.7;
                seg.castShadow = true;
                stalk.add(seg);

                if (s > 1 && s % 2 === 0) {
                    const leaf = new THREE.Mesh(new THREE.ConeGeometry(0.65, 1.6, 4), bambooLeafMat);
                    leaf.position.set((Math.random()-0.5)*0.6, s * 1.4 + 0.8, (Math.random()-0.5)*0.6);
                    leaf.rotation.z = (Math.random()-0.5) * 1.2;
                    stalk.add(leaf);
                }
            }
            stalk.position.set(x, 0, z);
            this.group.add(stalk);
        };

        // Bố trí bụi trúc bao quanh đấu trường (chừa tầm nhìn camera phía trước)
        for (let i = 0; i < 85; i++) {
            const angle = Math.random() * Math.PI * 2;
            const dist = 12.5 + Math.random() * 14;
            const bx = Math.cos(angle) * dist;
            const bz = Math.sin(angle) * dist;
            // Làm thưa bớt ở góc dưới trái/phải để không che nhân vật
            if (bz > 11 && Math.abs(bx) < 9) continue;
            createBambooStalk(bx, bz, 9 + Math.random() * 6);
        }

        // Tảng đá rêu phong & bụi cỏ
        const rockMat = new THREE.MeshStandardMaterial({ color: 0x4a5246, roughness: 0.95 });
        for (let i = 0; i < 16; i++) {
            const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(0.7 + Math.random()*0.8, 0), rockMat);
            const a = (i / 16) * Math.PI * 2;
            rock.position.set(Math.cos(a) * (10 + Math.random()*3), 0.35, Math.sin(a) * (10 + Math.random()*3));
            rock.scale.set(1.3, 0.7, 1.1);
            rock.castShadow = true;
            this.group.add(rock);
        }
    },

    // MAP 2 (Ảnh 3): Đài Phật Hoa Anh Đào
    buildBuddhaArenaMap: function(scene) {
        this.clearMap(scene);
        scene.background = new THREE.Color(0x526b6c);
        scene.fog = new THREE.FogExp2(0x7c9696, 0.012);

        // Sân gạch đá cổ rêu phong
        const floor = new THREE.Mesh(
            new THREE.BoxGeometry(26, 0.5, 22),
            new THREE.MeshStandardMaterial({ color: 0x8c8d75, roughness: 0.8 })
        );
        floor.position.y = -0.25;
        floor.receiveShadow = true;
        this.group.add(floor);

        // Lan can đá chạm khắc bao quanh
        const railMat = new THREE.MeshStandardMaterial({ color: 0x9ca3af, roughness: 0.7 });
        const leftRail = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.2, 22), railMat);
        leftRail.position.set(-13, 0.6, 0);
        this.group.add(leftRail);
        const rightRail = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.2, 22), railMat);
        rightRail.position.set(13, 0.6, 0);
        this.group.add(rightRail);

        // Tượng Đại Phật Cổ Khổng Lồ phía Bắc (Giống Ảnh 3)
        const buddhaGroup = new THREE.Group();
        const head = new THREE.Mesh(new THREE.SphereGeometry(2.6, 16, 16), new THREE.MeshStandardMaterial({ color: 0x6b7265, roughness: 0.85 }));
        head.scale.set(0.9, 1.15, 0.85);
        head.position.set(0, 3.2, -13);
        buddhaGroup.add(head);

        const ushnisha = new THREE.Mesh(new THREE.SphereGeometry(1.1, 12, 12), new THREE.MeshStandardMaterial({ color: 0x575e52 }));
        ushnisha.position.set(0, 5.8, -13);
        buddhaGroup.add(ushnisha);
        this.group.add(buddhaGroup);

        // Cây Hoa Anh Đào Hồng Rực Rỡ hai bên (Giống Ảnh 3)

// 6. HỆ THỐNG HIỆU ỨNG KỸ NĂNG & HẠT 3D (Tím / Xanh / Đỏ giống Ảnh 2 & 3)
window.ParticleSystem = {
    effects: [],

    spawnSkillVFX: function(scene, pos, colorHex, ringColorHex) {
        const group = new THREE.Group();
        group.position.copy(pos);
        group.position.y = 0.2;

        // Vòng tròn ma pháp xoay dưới đất (Giống vòng tím/xanh trong Ảnh 2)
        const magicCircle = new THREE.Mesh(
            new THREE.RingGeometry(1.2, 3.6, 32),
            new THREE.MeshBasicMaterial({ color: ringColorHex, side: THREE.DoubleSide, transparent: true, opacity: 0.85 })
        );
        magicCircle.rotation.x = -Math.PI / 2;
        group.add(magicCircle);

        // Vòng xoáy năng lượng đứng
        const vortex = new THREE.Mesh(
            new THREE.TorusGeometry(2.2, 0.14, 12, 32),
            new THREE.MeshBasicMaterial({ color: colorHex, transparent: true, opacity: 0.9 })
        );
        vortex.position.y = 1.2;
        vortex.rotation.x = Math.PI / 3;
        group.add(vortex);

        // Các tia kiếm khí / cánh hoa bay lên
        const shards = [];
        const shardMat = new THREE.MeshBasicMaterial({ color: colorHex });
        for (let i = 0; i < 18; i++) {
            const shard = new THREE.Mesh(new THREE.OctahedronGeometry(0.22, 0), shardMat);
            const a = (i / 18) * Math.PI * 2;
            const r = 0.8 + Math.random() * 2.2;
            shard.position.set(Math.cos(a) * r, Math.random() * 1.5, Math.sin(a) * r);
            shard.userData = { vy: 2.5 + Math.random() * 3, angle: a, radius: r };
            group.add(shard);
            shards.push(shard);
        }

        scene.add(group);
        this.effects.push({
            group, magicCircle, vortex, shards,
            life: 1.1, maxLife: 1.1
        });
    },

    spawnSlashSpark: function(scene, pos, colorHex) {
        const spark = new THREE.Mesh(
            new THREE.RingGeometry(0.2, 1.3, 16),
            new THREE.MeshBasicMaterial({ color: colorHex, side: THREE.DoubleSide, transparent: true, opacity: 0.9 })
        );
        spark.position.copy(pos);
        spark.position.y = 1.0;
        spark.lookAt(GameEngine.camera.position);
        scene.add(spark);
        this.effects.push({
            group: spark, isSimple: true, life: 0.35, maxLife: 0.35
        });
    },

    update: function(scene, dt) {
        for (let i = this.effects.length - 1; i >= 0; i--) {
            const ef = this.effects[i];
            ef.life -= dt;
            const progress = 1 - (ef.life / ef.maxLife);

            if (ef.isSimple) {
                ef.group.scale.setScalar(1 + progress * 1.5);
                ef.group.material.opacity = 1 - progress;
            } else {
                ef.magicCircle.rotation.z += dt * 4;
                ef.magicCircle.scale.setScalar(0.8 + progress * 0.6);
                ef.magicCircle.material.opacity = (1 - progress) * 0.85;

                ef.vortex.rotation.z -= dt * 7;
                ef.vortex.rotation.y += dt * 5;
                ef.vortex.material.opacity = 1 - progress;

                ef.shards.forEach(s => {
                    s.position.y += s.userData.vy * dt;
                    s.userData.angle += dt * 4;
                    s.position.x = Math.cos(s.userData.angle) * s.userData.radius;
                    s.position.z = Math.sin(s.userData.angle) * s.userData.radius;
                });
            }

            if (ef.life <= 0) {
                scene.remove(ef.group);
                this.effects.splice(i, 1);
            }
        }
    }
};

// 7. HỆ THỐNG CHIẾN ĐẤU TỰ ĐỘNG & KỸ NĂNG
window.CombatSystem = {
    triggerManualSkill: function(skillIndex) {
        const skill = VoLam.Database.skills[skillIndex];
        if (!skill) return;

        if (skill.currentCd > 0) {
            GameUI.showToast(`Tuyệt kỹ ${skill.name} đang hồi chiêu (${skill.currentCd.toFixed(1)}s)!`, 'purple');
            return;
        }

        const aliveAllies = GameEngine.allies.filter(u => !u.dead);
        const aliveEnemies = GameEngine.enemies.filter(u => !u.dead);
        if (aliveAllies.length === 0 || aliveEnemies.length === 0) return;

        skill.currentCd = skill.cooldown;
        const caster = aliveAllies[0];
        const primaryTarget = aliveEnemies[0];

        // Hiển thị chữ thư pháp tuyệt kỹ trên màn hình (Giống Ảnh 2 & 3)
        GameUI.showSkillBanner(skill.name);
        GameEngine.triggerCameraShake(0.45);

        // Hiệu ứng vòng tròn ma pháp 3D
        ParticleSystem.spawnSkillVFX(GameEngine.scene, primaryTarget.mesh.position, skill.color, skill.ringColor);

        // Tính sát thương
        const targets = skill.aoe ? aliveEnemies : [primaryTarget];
        targets.forEach((enemy, idx) => {
            const isCrit = Math.random() < 0.65;
            // Tạo con số sát thương khổng lồ đậm chất game kiếm hiệp (Giống Ảnh 2: 602082151841)
            const baseVal = Math.floor(caster.atk * skill.dmgMult * (0.9 + Math.random() * 0.3));
            const displayDmg = isCrit ? baseVal * 1245 : baseVal * 12;

            this.applyDamage(enemy, baseVal * 0.45, displayDmg, isCrit ? 'crit' : 'normal');
        });
    },

    applyDamage: function(target, realHpLoss, displayDmg, type) {
        if (target.dead) return;
        target.hp = Math.max(0, target.hp - realHpLoss);
        target.hitFlash = 0.2;

        // Cập nhật thanh máu trên đầu
        const pct = Math.max(0, (target.hp / target.maxHp) * 100);
        target.hpFillEl.style.width = `${pct}%`;

        // Chiếu tọa độ 3D ra 2D để hiện số sát thương bay lên
        const screenPos = GameEngine.toScreenPosition(target.mesh.position, 2.2);
        GameUI.spawnDamageNumber(screenPos.x + (Math.random()-0.5)*30, screenPos.y, displayDmg, type);

        // Cập nhật HUD nếu là Boss Ma Giáo Cao Thủ
        if (target.isBoss) {
            document.getElementById('right-qi-bar').style.width = `${pct}%`;
            document.getElementById('right-qi-val').innerText = Math.floor(target.hp / 10000);
        }

        if (target.hp <= 0) {
            target.dead = true;
            target.mesh.visible = false;
            target.labelEl.style.display = 'none';
            GameUI.showToast(`Đã đánh bại ${target.name}!`, 'gold');

            // Tự động triệu hồi đợt kẻ địch mới nếu tiêu diệt hết
            if (GameEngine.enemies.every(e => e.dead)) {
                setTimeout(() => GameEngine.spawnWave(), 1400);
            }
        }
    }
};

        this.shakeTime = duration;
    },

    toScreenPosition: function(vec3, yOffset = 0) {
        const container = document.getElementById('game-viewport');
        const vector = vec3.clone();
        vector.y += yOffset;
        vector.project(this.camera);
        return {
            x: (vector.x * 0.5 + 0.5) * container.clientWidth,
            y: (-(vector.y * 0.5) + 0.5) * container.clientHeight
        };
    },

    handleResize: function() {
        const container = document.getElementById('game-viewport');
        if (!container || !this.renderer) return;
        const w = container.clientWidth;
        const h = container.clientHeight;
        this.camera.aspect = w / h;
        this.camera.updateProjectionMatrix();
        this.renderer.setSize(w, h, false);
    },

    bindEvents: function(container) {
        window.addEventListener('resize', () => this.handleResize());

        // Phím tắt 1, 2, 3, 4 tung tuyệt kỹ
        window.addEventListener('keydown', (e) => {
            if (['1', '2', '3', '4'].includes(e.key)) {
                CombatSystem.triggerManualSkill(parseInt(e.key) - 1);
            }
        });

        // Kéo chuột / vuốt để xoay góc camera Isometric quanh chiến trường
        container.addEventListener('mousedown', (e) => {
            if (e.target.id === 'three-canvas') {
                this.isDragging = true;
                this.prevMouse = { x: e.clientX, y: e.clientY };
            }
        });
        window.addEventListener('mousemove', (e) => {
            if (!this.isDragging) return;
            const dx = e.clientX - this.prevMouse.x;
            this.cameraAngleOffset -= dx * 0.006;
            this.cameraAngleOffset = Math.max(-0.85, Math.min(0.85, this.cameraAngleOffset));
            this.updateCameraPosition();
            this.prevMouse = { x: e.clientX, y: e.clientY };
        });
        window.addEventListener('mouseup', () => { this.isDragging = false; });

        // Hỗ trợ cảm ứng trên điện thoại / máy tính bảng
        container.addEventListener('touchstart', (e) => {
            if (e.target.id === 'three-canvas' && e.touches.length === 1) {
                this.isDragging = true;
                this.prevMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
        }, { passive: true });
        container.addEventListener('touchmove', (e) => {
            if (!this.isDragging || e.touches.length !== 1) return;
            const dx = e.touches[0].clientX - this.prevMouse.x;
            this.cameraAngleOffset -= dx * 0.006;
            this.cameraAngleOffset = Math.max(-0.85, Math.min(0.85, this.cameraAngleOffset));
            this.updateCameraPosition();
            this.prevMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        }, { passive: true });
        container.addEventListener('touchend', () => { this.isDragging = false; });
    },

    updateUnits: function(dt) {
        const aliveAllies = this.allies.filter(u => !u.dead);
        const aliveEnemies = this.enemies.filter(u => !u.dead);

        // Cập nhật hồi chiêu 4 ô tuyệt kỹ
        VoLam.Database.skills.forEach((sk, idx) => {
            const overlay = document.getElementById(`cd-overlay-${idx}`);
            if (sk.currentCd > 0) {
                sk.currentCd = Math.max(0, sk.currentCd - dt);
                overlay.classList.remove('hidden');
                overlay.innerText = Math.ceil(sk.currentCd);
            } else {
                overlay.classList.add('hidden');
                // Tự động tung chiêu nếu bật Auto Skill
                if (this.isAutoBattle && this.isAutoSkill && aliveEnemies.length > 0 && Math.random() < 0.03) {
                    CombatSystem.triggerManualSkill(idx);
                }
            }
        });

        // AI & Chuyển động của Phe Ta
        aliveAllies.forEach((unit) => {
            unit.animPhase += dt * 6;
            unit.auraRing.rotation.z += dt * 2;
            unit.headGroup.position.y = 1.52 + Math.sin(unit.animPhase) * 0.04;

            if (this.isAutoBattle && aliveEnemies.length > 0) {
                const target = aliveEnemies[0];
                const dir = new THREE.Vector3().subVectors(target.mesh.position, unit.mesh.position);
                const dist = dir.length();
                unit.mesh.lookAt(target.mesh.position.x, 0, target.mesh.position.z);

                if (dist > 2.3) {
                    dir.normalize();
                    unit.mesh.position.addScaledVector(dir, dt * 3.8);
                } else {
                    unit.attackTimer -= dt;
                    // Hoạt ảnh vung kiếm chém
                    unit.weaponGroup.rotation.x = Math.sin(unit.animPhase * 2) * 0.9;
                    if (unit.attackTimer <= 0) {
                        unit.attackTimer = 1.1 + Math.random() * 0.4;
                        ParticleSystem.spawnSlashSpark(this.scene, target.mesh.position, 0x38bdf8);
                        const dmg = Math.floor(unit.atk * (0.8 + Math.random() * 0.4));
                        CombatSystem.applyDamage(target, dmg * 0.35, dmg * 4, Math.random() < 0.35 ? 'crit' : 'normal');
                    }
                }
            }

            // Cập nhật vị trí nhãn 2D
            const pos2d = this.toScreenPosition(unit.mesh.position, 2.35);
            unit.labelEl.style.left = `${pos2d.x}px`;
            unit.labelEl.style.top = `${pos2d.y}px`;
        });

        // AI & Chuyển động của Ma Giáo
        aliveEnemies.forEach((unit) => {
            unit.animPhase += dt * 5.5;
            unit.auraRing.rotation.z -= dt * 2.2;
            unit.headGroup.position.y = 1.52 + Math.sin(unit.animPhase) * 0.04;

            if (aliveAllies.length > 0) {
                const target = aliveAllies[0];
                const dir = new THREE.Vector3().subVectors(target.mesh.position, unit.mesh.position);
                const dist = dir.length();
                unit.mesh.lookAt(target.mesh.position.x, 0, target.mesh.position.z);

                if (dist > 2.4) {
                    dir.normalize();
                    unit.mesh.position.addScaledVector(dir, dt * 3.2);
                } else {
                    unit.attackTimer -= dt;
                    unit.weaponGroup.rotation.x = Math.cos(unit.animPhase * 2) * 0.85;
                    if (unit.attackTimer <= 0) {
                        unit.attackTimer = 1.35 + Math.random() * 0.5;
                        ParticleSystem.spawnSlashSpark(this.scene, target.mesh.position, 0xf43f5e);
                        const dmg = Math.floor(unit.atk * (0.7 + Math.random() * 0.3));
                        // Phe ta nhận sát thương nhẹ và tự hồi khí
                        const screenPos = this.toScreenPosition(target.mesh.position, 2.1);
                        GameUI.spawnDamageNumber(screenPos.x, screenPos.y, Math.floor(dmg / 150), 'normal');
                    }
                }
            }

            const pos2d = this.toScreenPosition(unit.mesh.position, 2.45 * (unit.isBoss ? 1.15 : 1));
            unit.labelEl.style.left = `${pos2d.x}px`;
            unit.labelEl.style.top = `${pos2d.y}px`;
        });
    },

    loop: function(now) {
        requestAnimationFrame((t) => this.loop(t));

        const rawDt = Math.min(0.05, (now - this.lastTime) / 1000);
        this.lastTime = now;

        // Đo FPS
        this.frameCount++;
        this.fpsTime += rawDt;
        if (this.fpsTime >= 0.5) {
            document.getElementById('fps-counter').innerText = `${Math.round(this.frameCount / this.fpsTime)} fps`;
            this.frameCount = 0;
            this.fpsTime = 0;
        }

        if (!this.isPaused) {
            const simDt = rawDt * this.battleSpeed;
            this.updateUnits(simDt);
            ParticleSystem.update(this.scene, simDt);

            // Rung lắc camera khi tung đại chiêu
            if (this.shakeTime > 0) {
                this.shakeTime -= rawDt;
                this.camera.position.x += (Math.random() - 0.5) * 0.35;
                this.camera.position.y += (Math.random() - 0.5) * 0.35;
                if (this.shakeTime <= 0) this.updateCameraPosition();
            }
        }

        this.renderer.render(this.scene, this.camera);
    }
};

// Khởi chạy game khi trang tải xong
window.onload = function() {
    GameEngine.init();
    setTimeout(() => {
        CombatSystem.triggerManualSkill(1); // Khai màn bằng tuyệt kỹ Đao Chữ Thần Thông
    }, 800);
};
</script>
